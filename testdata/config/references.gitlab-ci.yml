.rules:
  mr:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  default-branch:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  # A reference inside a referenced value is resolved too.
  mr-and-default-branch:
    - !reference [.rules, mr]
    - !reference [.rules, default-branch]

.images:
  go: golang:1.26

.setup:
  script:
    - go mod download

lint:
  image: !reference [.images, go]
  script:
    - !reference [.setup, script]
    - make lint
  rules:
    - !reference [.rules, mr-and-default-branch]
    - when: never

# A visible job can be referenced like a hidden one.
release:
  image: !reference [lint, image]
  script: [goreleaser]
  rules:
    - if: $CI_COMMIT_TAG
    - !reference [.rules, mr]
