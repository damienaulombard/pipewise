.tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never

.deep:
  extends: .tests

.rules: &mr_rules
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"

.base: &base
  only: [tags]

.shared:
  deploy:
    - if: $DEPLOY

own:
  script: [x]
  rules:
    - if: $CI_COMMIT_BRANCH

one-level:
  extends: .tests
  script: [x]

two-levels:
  extends: .deep
  script: [x]

alias:
  script: [x]
  rules: *mr_rules

merge-key:
  <<: *base
  script: [x]
  except: [main]

mixed:
  script: [x]
  rules:
    - !reference [.shared, deploy]
    - if: $CI_COMMIT_TAG
    - !reference [.missing, rules]

.wf:
  tag: &tag_rule
    if: $CI_COMMIT_TAG

workflow:
  rules:
    - *tag_rule
    - when: always
