.both: &both
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

merged:
  <<: *both
  script: [make merged]
  interruptible: true

anchored:
  script: [make anchored]
  interruptible: true
  rules: &mine
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

folded:
  script: [make folded]
  interruptible: true
  rules:
    - if: >
        $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG

.legacy:
  only: [branches, tags]

legacy:
  extends: .legacy
  script: [make legacy]
  interruptible: true

alias: *both

flow: {script: [make flow], interruptible: true}
