.tests:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_TAG
      when: never

.shared:
  deploy:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

unit:
  extends: .tests
  script: [make test]

deploy:
  script: [make deploy]
  rules:
    - !reference [.shared, deploy]
    - when: never

.never-main:
  except: [main]

release:
  extends: .never-main
  script: [make release]
  only: [tags]
