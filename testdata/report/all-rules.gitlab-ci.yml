# Triggers every rule pipewise has, and an unresolved reference.
default:
  image: node:latest
  artifacts:
    paths: [out/]

# No rules: on the default branch and the tag (redundant-job, no-rules); no cache.
lint:
  script: [npm ci, npm run lint]

# Merge requests only, not interruptible; tag without digest; no expire_in.
unit:
  image: golang:1.26
  script: [go test ./...]
  artifacts:
    paths: [coverage.out]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

audit:
  script: [npm audit]
  rules:
    - !reference [.missing]

# End-to-end suite on merge requests and the default branch (e2e-everywhere, redundant-job).
e2e:
  inherit:
    default: false
  interruptible: true
  script: [make e2e]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Image built with the tag in its name (version-baked-at-build); in the build
# stage, so the jobs of the test stage above wait for it (stages-without-needs).
build:
  stage: build
  inherit:
    default: false
  image: docker:27@sha256:0123456789abcdef
  script: [docker build -t app:$CI_COMMIT_TAG .]
  rules:
    - if: $CI_COMMIT_TAG
