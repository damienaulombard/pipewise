name: Release

# The main pipeline publishes, it does not test again: the pull request
# already tested the commit that lands on main.
#
# release-please keeps one release pull request up to date from the commits
# on main. Merging it is the decision to release: it creates a draft GitHub
# release and its tag (force-tag-creation, so that the release pull request
# built in the same run finds this release), then the publish job builds,
# smoke-tests the binary, uploads the archives and publishes the release. The
# release is never public without its archives. A release made with the
# workflow token starts no other workflow, which is why the publish job lives
# here. Once the release is public, the homebrew job pushes its formula to the
# tap; it is the only job that gets HOMEBREW_TAP_TOKEN, and its failure leaves
# the release published.
on:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    name: Release pull request
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # release-please labels its pull request (autorelease: pending, tagged).
      issues: write
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      # Pinned by commit: the only third-party action here with write access.
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build and publish
    needs: release-please
    if: needs.release-please.outputs.created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      # Build the commit release-please released, which its tag names.
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the archives
        run: make dist VERSION="$TAG"
      - name: Smoke test the Linux binary
        run: |
          name="pipewise_${TAG}_linux_amd64"
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$name/pipewise" version)" = "pipewise $TAG"
          "$RUNNER_TEMP/$name/pipewise" lint testdata/report/clean.gitlab-ci.yml
          "$RUNNER_TEMP/$name/pipewise" explain unit testdata/explain/inherited.gitlab-ci.yml
      - name: Upload the archives and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release upload "$TAG" dist/*.tar.gz dist/*.zip dist/SHA256SUMS --clobber
          gh release edit "$TAG" --draft=false

  homebrew:
    name: Homebrew formula
    needs: [release-please, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.release-please.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The checksums of the published archives, not of a new build.
      - name: Generate the formula
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release download "$TAG" --pattern SHA256SUMS --dir "$RUNNER_TEMP"
          go run ./tools/formula -repo "$GH_REPO" -tag "$TAG" -sums "$RUNNER_TEMP/SHA256SUMS" > "$RUNNER_TEMP/pipewise.rb"
      # The token is only given to the tap checkout, after the generator ran.
      - uses: actions/checkout@v7
        with:
          repository: studio-fita/homebrew-tap
          ref: main
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: tap
      - name: Push the formula to the tap
        working-directory: tap
        run: |
          mkdir -p Formula
          cp "$RUNNER_TEMP/pipewise.rb" Formula/pipewise.rb
          git add Formula/pipewise.rb
          if git diff --cached --quiet; then
            echo "Formula/pipewise.rb is already at $TAG"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "pipewise $TAG"
          git push origin HEAD:main
