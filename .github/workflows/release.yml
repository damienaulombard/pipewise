name: Release

# A tag names a commit the pull request already tested: this workflow
# builds, smoke-tests the binary and publishes. It does not test again.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build and publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build the archives
        run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Smoke test the Linux binary
        run: |
          name="pipewise_${GITHUB_REF_NAME}_linux_amd64"
          tar -xzf "dist/$name.tar.gz" -C "$RUNNER_TEMP"
          test "$("$RUNNER_TEMP/$name/pipewise" version)" = "pipewise $GITHUB_REF_NAME"
          "$RUNNER_TEMP/$name/pipewise" lint testdata/report/clean.gitlab-ci.yml
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/*.zip dist/SHA256SUMS \
            --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
