# Weekly dependency updates, one grouped pull request per ecosystem.
# The commit prefix keeps release-please from cutting a release for them.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(deps)
    groups:
      gomod:
        patterns: ["*"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore(ci)
    groups:
      github-actions:
        patterns: ["*"]
